<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>智能任务管理系统</title>
<style>
  :root {
    --bg: #f5f6f8;
    --card: #ffffff;
    --text: #1f2430;
    --muted: #8a94a6;
    --border: #e8eaee;
    --primary: #2f6fed;
    --primary-soft: #eaf0ff;
    --high: #e5484d;
    --high-soft: #fdeced;
    --medium: #d98200;
    --medium-soft: #fff4e3;
    --low: #12a150;
    --low-soft: #e8f8ee;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 16px 64px;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; }
  header { margin-bottom: 20px; }
  h1 { font-size: 22px; font-weight: 600; margin: 0 0 6px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; }
  .count { color: var(--muted); font-size: 13px; margin-top: 4px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 1px 2px rgba(16,24,40,.04);
  }

  /* 添加区 */
  .add-card { padding: 16px; margin-bottom: 16px; }
  .add-row { display: flex; gap: 10px; }
  .input {
    flex: 1; min-width: 0;
    height: 42px; padding: 0 14px;
    font-size: 14px; color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  .input::placeholder { color: #b4bccb; }
  .input:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .select {
    height: 42px; padding: 0 10px;
    font-size: 14px; color: var(--text);
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 10px;
    outline: none;
    cursor: pointer;
  }
  .select:focus { border-color: var(--primary); box-shadow: 0 0 0 3px var(--primary-soft); }
  .btn-primary {
    height: 42px; padding: 0 20px;
    font-size: 14px; font-weight: 500;
    color: #fff; background: var(--primary);
    border: none; border-radius: 10px;
    cursor: pointer;
    transition: background .15s, opacity .15s;
    white-space: nowrap;
  }
  .btn-primary:hover { background: #2560d8; }
  .btn-primary:disabled { opacity: .55; cursor: not-allowed; }
  .hint { margin-top: 8px; font-size: 12px; color: var(--muted); min-height: 16px; }
  .hint.err { color: var(--high); }

  /* 筛选 */
  .filters { display: flex; gap: 8px; margin-bottom: 14px; flex-wrap: wrap; }
  .chip {
    height: 32px; padding: 0 14px;
    font-size: 13px;
    color: #5b6475; background: #fff;
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    transition: all .15s;
  }
  .chip:hover { border-color: #d3d8e0; color: var(--text); }
  .chip.active {
    color: var(--primary); background: var(--primary-soft);
    border-color: #c5d5fb; font-weight: 500;
  }

  /* 列表 */
  .list-card { padding: 6px 0; overflow: hidden; }
  .task {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--border);
  }
  .task:last-child { border-bottom: none; }
  .prio {
    flex: 0 0 auto;
    min-width: 34px; height: 24px;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 500;
    border-radius: 6px;
  }
  .prio.高 { color: var(--high); background: var(--high-soft); }
  .prio.中 { color: var(--medium); background: var(--medium-soft); }
  .prio.低 { color: var(--low); background: var(--low-soft); }

  .body { flex: 1; min-width: 0; }
  .title {
    font-size: 14px; line-height: 1.5;
    word-break: break-word;
  }
  .title.done {
    text-decoration: line-through;
    color: #a2a9b6;
  }
  .meta {
    margin-top: 3px;
    font-size: 12px; color: var(--muted);
    display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  }
  .state-done { color: var(--low); }
  .state-todo { color: var(--muted); }

  .actions { display: flex; gap: 8px; flex: 0 0 auto; }
  .btn-sm {
    height: 30px; padding: 0 12px;
    font-size: 13px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: #fff; color: #40495a;
    cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .btn-sm:hover { background: #f7f8fa; border-color: #d3d8e0; }
  .btn-sm.toggle-done { color: var(--low); border-color: #cdeedd; background: #f4fbf7; }
  .btn-sm.danger:hover { color: var(--high); border-color: #f7c9cb; background: var(--high-soft); }
  .btn-sm:disabled { opacity: .5; cursor: not-allowed; }

  .empty { padding: 56px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .empty .big { font-size: 28px; margin-bottom: 10px; }
  .loading { padding: 40px; text-align: center; color: var(--muted); font-size: 14px; }

  @media (max-width: 560px) {
    .add-row { flex-wrap: wrap; }
    .input { flex: 1 1 100%; }
    .select { flex: 1; }
    .btn-primary { flex: 1; }
    .actions { flex-direction: column; }
    .task { align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>智能任务管理系统</h1>
    <div class="sub">数据存储于 Supabase</div>
    <div class="count" id="count"></div>
  </header>

  <!-- 添加任务 -->
  <section class="card add-card">
    <form class="add-row" id="addForm" autocomplete="off">
      <input class="input" id="titleInput" type="text" maxlength="200" placeholder="输入任务内容，例如：整理本周项目进度" />
      <select class="select" id="prioritySelect">
        <option value="高">高优先级</option>
        <option value="中" selected>中优先级</option>
        <option value="低">低优先级</option>
      </select>
      <button class="btn-primary" id="addBtn" type="submit">添加任务</button>
    </form>
    <div class="hint" id="hint"></div>
  </section>

  <!-- 优先级筛选 -->
  <div class="filters" id="filters">
    <button class="chip active" data-p="all">全部</button>
    <button class="chip" data-p="高">高</button>
    <button class="chip" data-p="中">中</button>
    <button class="chip" data-p="低">低</button>
  </div>

  <!-- 任务列表 -->
  <section class="card list-card" id="listCard">
    <div class="loading">正在加载任务…</div>
  </section>
</div>

<script>
  const listCard = document.getElementById('listCard');
  const countEl = document.getElementById('count');
  const hintEl = document.getElementById('hint');
  const addForm = document.getElementById('addForm');
  const titleInput = document.getElementById('titleInput');
  const prioritySelect = document.getElementById('prioritySelect');
  const addBtn = document.getElementById('addBtn');

  let currentFilter = 'all';
  let tasks = [];

  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));

  function showHint(msg, isErr) {
    hintEl.textContent = msg || '';
    hintEl.className = 'hint' + (isErr ? ' err' : '');
  }

  function formatTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (Number.isNaN(d.getTime())) return '';
    const pad = (n) => String(n).padStart(2, '0');
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render() {
    const doneCount = tasks.filter((t) => t.completed).length;
    countEl.textContent = tasks.length
      ? `共 ${tasks.length} 条任务 · 已完成 ${doneCount} 条 · 未完成 ${tasks.length - doneCount} 条`
      : '';

    if (!tasks.length) {
      listCard.innerHTML = `<div class="empty"><div class="big">📝</div>${
        currentFilter === 'all' ? '还没有任务，在上方输入框添加第一条吧' : `暂无「${esc(currentFilter)}」优先级的任务`
      }</div>`;
      return;
    }

    listCard.innerHTML = tasks.map((t) => `
      <div class="task" data-id="${t.id}">
        <span class="prio ${esc(t.priority)}">${esc(t.priority)}</span>
        <div class="body">
          <div class="title ${t.completed ? 'done' : ''}">${esc(t.title)}</div>
          <div class="meta">
            <span class="${t.completed ? 'state-done' : 'state-todo'}">${t.completed ? '已完成' : '未完成'}</span>
            <span>·</span>
            <span>${formatTime(t.created_at)}</span>
          </div>
        </div>
        <div class="actions">
          <button class="btn-sm ${t.completed ? '' : 'toggle-done'}" data-act="toggle" data-id="${t.id}" data-next="${!t.completed}">
            ${t.completed ? '标为未完成' : '标为完成'}
          </button>
          <button class="btn-sm danger" data-act="delete" data-id="${t.id}">删除</button>
        </div>
      </div>
    `).join('');
  }

  async function loadTasks() {
    try {
      const q = currentFilter === 'all' ? '' : `?priority=${encodeURIComponent(currentFilter)}`;
      const res = await fetch(`/api/tasks${q}`);
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || '加载失败');
      tasks = json.data;
      render();
    } catch (err) {
      listCard.innerHTML = `<div class="empty">加载失败：${esc(err.message)}</div>`;
    }
  }

  // 添加任务
  addForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    const title = titleInput.value.trim();
    if (!title) { showHint('请输入任务内容', true); titleInput.focus(); return; }

    addBtn.disabled = true;
    addBtn.textContent = '添加中…';
    try {
      const res = await fetch('/api/tasks', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, priority: prioritySelect.value }),
      });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || '添加失败');
      titleInput.value = '';
      showHint('');
      // 新增后若当前筛选与新任务优先级不符，自动切回全部以展示结果
      if (currentFilter !== 'all' && currentFilter !== json.data.priority) {
        currentFilter = 'all';
        document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c.dataset.p === 'all'));
      }
      await loadTasks();
      titleInput.focus();
    } catch (err) {
      showHint(err.message, true);
    } finally {
      addBtn.disabled = false;
      addBtn.textContent = '添加任务';
    }
  });

  // 筛选
  document.getElementById('filters').addEventListener('click', (e) => {
    const chip = e.target.closest('.chip');
    if (!chip) return;
    currentFilter = chip.dataset.p;
    document.querySelectorAll('.chip').forEach((c) => c.classList.toggle('active', c === chip));
    loadTasks();
  });

  // 完成状态切换 / 删除
  listCard.addEventListener('click', async (e) => {
    const btn = e.target.closest('button[data-act]');
    if (!btn) return;
    const id = btn.dataset.id;
    btn.disabled = true;

    try {
      if (btn.dataset.act === 'toggle') {
        const completed = btn.dataset.next === 'true';
        const res = await fetch(`/api/tasks/${id}`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed }),
        });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '更新失败');
      } else {
        const res = await fetch(`/api/tasks/${id}`, { method: 'DELETE' });
        const json = await res.json();
        if (!json.ok) throw new Error(json.error || '删除失败');
      }
      await loadTasks();
    } catch (err) {
      showHint(err.message, true);
      btn.disabled = false;
    }
  });

  loadTasks();
</script>
</body>
</html>
